name: Ktlint Code Style Check

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ktlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint-check:
    name: Verify Kotlin Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Ktlint Check
        run: ./gradlew ktlintCheck --no-daemon --stacktrace
